<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="./assets/style/style.css">

  <title>Frontend Mentor | Stats preview card component</title>

</head>
<body>

  <main>
    <section class="stats-preview">
      <section class="card-component">

        <div class="left">
          <h1>
            Get <span>insights</span> that help
            your business grow.
          </h1>
          <p>
            Discover the benefits of data analytics and make
            better decisions regarding revenue, customer
            experience, and overall efficiency.
          </p>

          <div class="stats">

            <div>
              <h3>
                10k+
              </h3>
              <p>
                companies
              </p>
            </div>

            <div>
              <h3>
                314 
              </h3>
              <p>
                templates
              </p>
            </div>

            <div>
              <h3>
                12M+
              </h3>
              <p>
                queries
              </p>
            </div>

          </div>

        </div>

        <div class="right">
          <picture>
            <source media="(max-width: 912px)" srcset="./assets/images/image-header-mobile.jpg">
            <img src="./assets/images/image-header-desktop.jpg" alt="image-product">
          </picture>
        </div>

      </section>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/nzanzulandry87-byte">Landry mast</a>.
  </footer>
</body>
</html>
